<div class="auth-backdrop" (click)="close.emit()">
  <div class="auth-modal" (click)="$event.stopPropagation()">

    <!-- Signed-in state -->
    <ng-container *ngIf="authService.currentUser && !authService.isAnonymous; else signedOut">
      <button class="close-btn" (click)="close.emit()" aria-label="Close">✕</button>
      <div class="account-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <p class="account-email">{{ authService.currentUser.email }}</p>
      <button class="secondary-btn" (click)="onSignOut()" [disabled]="loading">Sign out</button>
    </ng-container>

    <!-- Signed-out / anonymous views -->
    <ng-template #signedOut>
      <button class="close-btn" (click)="close.emit()" aria-label="Close">✕</button>

      <!-- Menu view -->
      <ng-container *ngIf="view === 'menu'">
        <h2>Save Your Progress</h2>
        <p class="subtitle">Create an account to sync your stats across devices.</p>
        <div class="action-stack">
          <button class="primary-btn" (click)="switchTo('sign-up')">Create account</button>
          <button class="primary-btn" (click)="switchTo('sign-in')">Sign in</button>
          <button class="secondary-btn" (click)="onPlayAsGuest()" [disabled]="loading">Play without account</button>
        </div>
      </ng-container>

      <!-- Sign-in view -->
      <ng-container *ngIf="view === 'sign-in'">
        <h2>Sign In</h2>
        <form (ngSubmit)="onSignIn()" #form="ngForm">
          <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required autocomplete="email">
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required autocomplete="current-password">
          <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
          <button type="submit" class="primary-btn" [disabled]="loading || !email || !password">
            {{ loading ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>
        <div class="divider"><span>or</span></div>
        <button class="oauth-btn google-btn" (click)="onSignInWithGoogle()" [disabled]="loading">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="oauth-btn apple-btn" (click)="onSignInWithApple()" [disabled]="loading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continue with Apple
        </button>
        <button class="text-btn" (click)="switchTo('menu')">Back</button>
      </ng-container>

      <!-- Sign-up view -->
      <ng-container *ngIf="view === 'sign-up'">
        <h2>Create Account</h2>
        <form (ngSubmit)="onSignUp()" #form="ngForm">
          <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required autocomplete="email">
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required autocomplete="new-password">
          <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
          <button type="submit" class="primary-btn" [disabled]="loading || !email || !password">
            {{ loading ? 'Creating account…' : 'Create account' }}
          </button>
        </form>
        <div class="divider"><span>or</span></div>
        <button class="oauth-btn google-btn" (click)="onSignInWithGoogle()" [disabled]="loading">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="oauth-btn apple-btn" (click)="onSignInWithApple()" [disabled]="loading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continue with Apple
        </button>
        <button class="text-btn" (click)="switchTo('menu')">Back</button>
      </ng-container>

      <!-- Upgrade (anonymous → real account) view -->
      <ng-container *ngIf="view === 'upgrade'">
        <h2>Save Your Progress</h2>
        <p class="subtitle">Link an account to keep your stats across devices.</p>
        <form (ngSubmit)="onLinkEmail()" #form="ngForm">
          <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required autocomplete="email">
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required autocomplete="new-password">
          <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
          <button type="submit" class="primary-btn" [disabled]="loading || !email || !password">
            {{ loading ? 'Saving…' : 'Save progress' }}
          </button>
        </form>
        <button class="text-btn" (click)="close.emit()">Maybe later</button>
      </ng-container>

    </ng-template>
  </div>
</div>
