<div class="keyboard">
  <div class="keyboard-row" *ngFor="let row of rows; let last = last">
    <button
      *ngFor="let letter of row"
      class="key"
      [class.disabled]="isDisabled(letter)"
      [disabled]="isDisabled(letter)"
      (mousedown)="$event.preventDefault()"
      (click)="onKey(letter)"
      type="button"
    >{{ letter }}</button>
    <button
      *ngIf="last"
      class="key key-backspace"
      (mousedown)="$event.preventDefault()"
      (click)="onBackspace()"
      type="button"
      aria-label="Backspace"
    >⌫</button>
  </div>
</div>
